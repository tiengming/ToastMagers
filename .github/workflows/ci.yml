name: ToastMagers CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '25.2.9519653'
          packages: 'platforms;android-34'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build and Test Project
        run: ./gradlew build --no-daemon

      - name: Generate Magisk Module ZIP
        run: ./gradlew zipModule --no-daemon

      - name: Verify ZIP content
        run: |
          if [ ! -f out/ToastMagers-release.zip ]; then
            echo "ZIP file not generated!"
            exit 1
          fi
          unzip -l out/ToastMagers-release.zip | grep -q "module.prop" || { echo "module.prop missing"; exit 1; }
          unzip -l out/ToastMagers-release.zip | grep -q "META-INF/" || { echo "META-INF missing"; exit 1; }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToastMagers-release
          path: out/ToastMagers-release.zip
          if-no-files-found: error
